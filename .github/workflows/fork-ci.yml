name: Fork CI

# Fork-only workflow. It gives this fork's development branch CI without adding
# the branch name to upstream's ci.yml: a fork-only line inside an upstream file
# is exactly what has to be undone by hand before the integration is proposed
# upstream. Delete this file together with the rest of the fork plumbing when the
# integration lands upstream.
#
# The upstream workflow keeps running on pull_request and on push to main, so a
# PR from this branch is still covered by it.

on:
  push:
    branches:
      - agy/ai-v4.2.0_shell-v4.3.0
  workflow_dispatch:

jobs:
  unit-tests:
    name: Fork Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run unit tests
        run: go test ./...

  antigravitycli-drift-check:
    name: Antigravity CLI Drift Check
    uses: ./.github/workflows/antigravitycli-drift.yml
