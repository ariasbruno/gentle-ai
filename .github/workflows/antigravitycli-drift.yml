name: Antigravity CLI Drift

# Keeps the AGY bundle honest: the generated assets under
# internal/assets/antigravitycli must match the gentle-shell commit pinned in
# PROVENANCE.json. This lives in its own workflow instead of a job inside ci.yml
# so the generated-bundle gate travels with the code that generates it, and so a
# fork can call it as a reusable workflow from its own CI.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  antigravitycli-drift-check:
    name: Antigravity CLI Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Read provenance and checkout gentle-shell at pinned commit
        run: |
          PROV_FILE="internal/assets/antigravitycli/PROVENANCE.json"
          if [[ ! -f "$PROV_FILE" ]]; then
            echo "::error::PROVENANCE.json not found at $PROV_FILE"
            exit 1
          fi
          PINNED_SHA=$(jq -r '.source_commit' "$PROV_FILE")
          SOURCE_REPO=$(jq -r '.source_repo' "$PROV_FILE")
          echo "pinned_sha=$PINNED_SHA" >> $GITHUB_OUTPUT
          echo "source_repo=$SOURCE_REPO" >> $GITHUB_OUTPUT
        id: provenance

      - name: Checkout gentle-shell at pinned commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ steps.provenance.outputs.source_repo }}
          ref: ${{ steps.provenance.outputs.pinned_sha }}
          path: gentle-shell

      - name: Run drift check gate (blocking)
        run: |
          go run ./scripts/transpile-antigravitycli --check --source-dir ./gentle-shell

      - name: Advisory freshness check (non-blocking)
        run: |
          PINNED_SHA="${{ steps.provenance.outputs.pinned_sha }}"
          SOURCE_REPO="${{ steps.provenance.outputs.source_repo }}"
          REMOTE_HEAD=$(git ls-remote "$SOURCE_REPO" HEAD | cut -f1)
          if [[ "$PINNED_SHA" != "$REMOTE_HEAD" ]]; then
            echo "::warning::Antigravity CLI bundle is pinned to $PINNED_SHA but gentle-shell HEAD is $REMOTE_HEAD"
            echo "::notice::Run the transpiler with --source-dir to regenerate the bundle from the latest gentle-shell."
          else
            echo "Bundle is up to date with gentle-shell HEAD ($PINNED_SHA)."
          fi
